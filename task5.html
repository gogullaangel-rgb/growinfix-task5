<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Responsive Card Collection</h1>

  <div class="container">

    <!-- Profile Card -->
    <div class="card">
      <img src="https://via.placeholder.com/300x180" alt="">
      <h2>Angel</h2>
      <p>Frontend Developer</p>
      <button>Follow</button>
    </div>

    <!-- Product Card -->
    <div class="card">
      <img src="https://via.placeholder.com/300x180" alt="">
      <h2>Smart Watch</h2>
      <p>₹1999</p>
      <button>Add to Cart</button>
    </div>

    <!-- Blog Card -->
    <div class="card">
      <img src="https://via.placeholder.com/300x180" alt="">
      <h2>Web Development</h2>
      <p>Learn modern frontend skills easily.</p>
      <button>Read More</button>
    </div>

    <!-- Testimonial Card -->
    <div class="card">
      <img src="https://via.placeholder.com/300x180" alt="">
      <h2>Client Review</h2>
      <p>⭐⭐⭐⭐⭐ Amazing design and support!</p>
      <button>View</button>
    </div>

  </div>

</body>
</html>
